crons:
  - name: sauvegarde-21h
    description: "Sauvegarde automatique quotidienne de la base de données à 21h (heure de Dakar)"
    cron: "0 21 * * *"
    timezone: "Africa/Dakar"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/backup"
    method: POST
    enabled: true
